<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Metamorfosis: Conecta-Crea-Transforma</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#24142c;overflow:hidden;font-family:system-ui,"Segoe UI",Roboto,sans-serif;color:#fff;touch-action:none}
#wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
canvas{display:block;width:100%;height:100%;border-radius:6px;box-shadow:0 0 0 3px #5b3418}
#hud{position:absolute;left:0;right:0;top:0;padding:5px 6px;pointer-events:none;font-weight:800;text-shadow:0 2px 0 #000a;font-size:clamp(10px,2.1vw,17px);display:flex;justify-content:space-between;gap:6px}
#hud .b{background:#0007;border-radius:8px;padding:2px 8px;display:inline-block;margin:0 3px 3px 0}
#hl{flex:1}
#lv{color:#ffd166}#obj{color:#c8ffb0;display:inline-block;background:#0007;border-radius:8px;padding:2px 8px}
.hr{color:#ff4d6d}
#hb{pointer-events:auto;display:flex;gap:5px;align-items:flex-start}
.ib{width:clamp(28px,5vw,40px);height:clamp(28px,5vw,40px);border-radius:50%;border:2px solid #fff;background:#f08a24;color:#fff;font-weight:900;font-size:clamp(12px,2.4vw,18px);cursor:pointer}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:#000c;padding:6px 12px;border-radius:10px;font-weight:700;font-size:clamp(11px,2.3vw,18px);opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:92%;border:2px solid #ffd166}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000b;z-index:20;padding:10px}
.card{background:linear-gradient(#fff8e8,#ffe1b5);color:#3a2410;border:4px solid #5b3418;border-radius:14px;max-width:560px;width:100%;max-height:94vh;overflow:auto;padding:14px 16px;box-shadow:0 8px 0 #0007;text-align:center}
.card h1{color:#d9581a;font-size:clamp(20px,4.5vw,30px);margin:4px 0 6px}
.card h2{color:#7a3a10;font-size:clamp(16px,3.4vw,22px);margin:4px 0 8px}
.card p{margin:6px 0;font-size:clamp(13px,2.6vw,16px);line-height:1.35}
.card .obj{background:#fff;border:2px dashed #e0661b;border-radius:10px;padding:6px}
.tag{display:inline-block;background:#5b3418;color:#ffd166;border-radius:20px;padding:2px 10px;font-weight:800;font-size:13px}
.cyc{font-size:clamp(20px,5vw,30px);margin:6px 0}
.card button{display:inline-block;background:#f08a24;color:#fff;border:3px solid #5b3418;border-radius:10px;padding:9px 16px;font-weight:800;font-size:16px;margin:6px 4px;cursor:pointer;box-shadow:0 4px 0 #5b3418}
.card button.opt{display:block;width:100%;text-align:left;background:#fff;color:#3a2410}
.card table{margin:4px auto;border-collapse:collapse;font-size:clamp(12px,2.5vw,15px);text-align:left}
.card td{padding:3px 6px;border-bottom:1px solid #e8c79a}
.card ul{text-align:left;margin:4px 0 4px 20px;font-size:clamp(12px,2.5vw,15px)}
#tc{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:8px 10px;pointer-events:none;z-index:10}
.g{pointer-events:auto}
.dp{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:56px 56px;gap:4px}
.ab{display:flex;gap:8px;align-items:flex-end}
.tb{width:56px;height:56px;border-radius:50%;background:#ffffff30;border:3px solid #ffffffaa;color:#fff;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;touch-action:none;padding:0}
.tb.big{width:70px;height:70px;font-size:14px}
.tb.sm{width:46px;height:46px;font-size:18px}
.tb.on{background:#ffd16699}
.mg{display:grid;gap:6px;margin:8px auto;max-width:420px}
.mc{aspect-ratio:1;font-size:clamp(18px,5vw,30px);border-radius:12px;border:3px solid #5b3418;background:#f6d6a8;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#3a2410;font-weight:800;padding:2px;text-align:center}
.mc small{font-size:clamp(10px,2.4vw,14px)}.mc.up{background:#fff}.mc.ok{background:#bff0a8}
.pz{width:min(78vw,300px);height:min(78vw,300px);grid-template-columns:repeat(3,1fr);gap:2px}
.pz div{background-size:300% 300%;border:2px solid #fff;cursor:pointer;border-radius:6px}.pz .sel{outline:4px solid #f08a24}
.cn{display:grid;grid-template-columns:1fr 1.7fr;gap:6px}.cn button{margin:0!important;font-size:13px!important;padding:6px!important}
.cn .ok{background:#5fd35f!important}.cn .sel{background:#7a3a10!important}.cn .no{background:#e04848!important}
.sm4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:300px;margin:8px auto}
.sm4 button{height:86px;font-size:32px!important;opacity:.55;transition:.15s}.sm4 button.lit{opacity:1;transform:scale(1.08);box-shadow:0 0 18px #fff}
.card{background:radial-gradient(circle at 20% 15%,#fffdf6,#fbe8c8 60%,#f3d3a6)}
#ov.cov{background:radial-gradient(ellipse at center,rgba(255,240,220,.05),rgba(40,10,40,.55))}
.card.cv{background:rgba(255,250,240,.82);backdrop-filter:blur(3px);border:4px solid #fff;box-shadow:0 0 0 4px #e0661b,0 12px 30px #0008;max-width:520px}
.ttl{font-size:clamp(34px,9vw,62px);font-weight:900;line-height:1;margin:2px 0;background:linear-gradient(90deg,#ff7a1a,#ffb300,#e0466b,#8a4dff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #5b3418);letter-spacing:1px;animation:pulse 2.4s ease-in-out infinite}
.sub2{font-size:clamp(14px,3.4vw,20px);font-weight:900;color:#7a3a10;letter-spacing:3px;margin-bottom:6px}
.sub2 b{color:#e0661b}.sub2 i{color:#2f8a42;font-style:normal}.sub2 u{color:#8a4dff;text-decoration:none}
@keyframes pulse{50%{transform:scale(1.04) rotate(-1deg)}}
.bf{display:inline-block;animation:fly 3s ease-in-out infinite}@keyframes fly{50%{transform:translateY(-8px) rotate(8deg)}}
#pn{font-size:18px;padding:9px 12px;border-radius:12px;border:3px solid #e0661b;width:min(80%,280px);text-align:center;font-weight:800;color:#3a2410;outline:none;margin:4px 0;user-select:text;-webkit-user-select:text}
.card button.go{font-size:20px;padding:12px 28px;background:linear-gradient(#ffa63d,#e0661b);animation:pulse 1.6s infinite}
.rk{width:100%;border-collapse:collapse;margin:6px 0;font-size:clamp(13px,2.8vw,16px)}
.rk td{padding:5px 6px;border-bottom:1px dashed #e8c79a}.rk tr.me{background:#ffe08a;font-weight:900}

 fill(r0,r1,c0,c1,ch){for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)m.set(r,c,ch)},
 gr(c0,c1){m.fill(H-2,H-1,c0,c1,'#')},pl(r,c0,c1){m.fill(r,r,c0,c1,'=')},
 wa(c0,c1){m.fill(H-2,H-2,c0,c1,'~');m.fill(H-1,H-1,c0,c1,'#')},
 es(s){s.trim().split(/\s+/).forEach(x=>{const a=x.split(',');ents.push({t:a[0],r:+a[1],c:+a[2]+m.o})})}};
 f(m);return{W,H,g,ents};}

/* ---------- MAP HELPERS ---------- */
function tileAt(c,r){return(!lv||r<0||r>=lv.H||c<0||c>=lv.W)?' ':lv.g[r][c];}
function solidAt(c,r){if(c<0||c>=lv.W)return true;if(r<0||r>=lv.H)return false;return lv.g[r][c]==='#';}
function hitSolid(x,y,w,h){const c0=Math.floor(x/TS),c1=Math.floor((x+w-.01)/TS),r0=Math.floor(y/TS),r1=Math.floor((y+h-.01)/TS);
 for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(solidAt(c,r))return true;return false;}
function moveX(o,dx){o.x+=dx;if(hitSolid(o.x,o.y,o.w,o.h)){if(dx>0)o.x=Math.floor((o.x+o.w-.01)/TS)*TS-o.w;else o.x=(Math.floor(o.x/TS)+1)*TS;return true}return false}
function moveY(o,dy,ow){const pb=o.y+o.h;o.y+=dy;
 if(hitSolid(o.x,o.y,o.w,o.h)){if(dy>0){o.y=Math.floor((o.y+o.h-.01)/TS)*TS-o.h;o.vy=0;return true}o.y=(Math.floor(o.y/TS)+1)*TS;o.vy=0;return false}
 if(ow&&dy>0){const r=Math.floor((o.y+o.h)/TS),top=r*TS;if(pb<=top+.01){const c0=Math.floor(o.x/TS),c1=Math.floor((o.x+o.w-.01)/TS);for(let c=c0;c<=c1;c++)if(tileAt(c,r)==='='){o.y=top-o.h;o.vy=0;return true}}}
 return false}
function blob(x,y,r,c,a){ctx.globalAlpha=a;ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,Math.max(.5,r),0,6.283);ctx.fill();ctx.globalAlpha=1;}
function ell(x,y,rx,ry,rt,c,a){ctx.globalAlpha=a;ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,rt,0,6.283);ctx.fill();ctx.globalAlpha=1;}
const ovl=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function isStem(){const c=Math.floor((p.x+p.w/2)/TS);return tileAt(c,Math.floor((p.y+p.h/2)/TS))==='|'||tileAt(c,Math.floor((p.y+p.h-1)/TS))==='|';}
function inWater(o){const c0=Math.floor(o.x/TS),c1=Math.floor((o.x+o.w-.01)/TS),r=Math.floor((o.y+o.h-3)/TS);for(let c=c0;c<=c1;c++)if(tileAt(c,r)==='~')return true;return false;}

function setSize(){let w,h;
 if(li===0){w=9;h=6}else if(li===1){const s=.25+.75*Math.min(1,st.leaves/10);w=Math.round(8+10*s);h=Math.round(5+5*s)}

 if(p.h){p.y-=h-p.h;p.x-=(w-p.w)/2;}p.w=w;p.h=h;
 if(lv&&hitSolid(p.x,p.y,p.w,p.h)){p.y+=h-(p.ph||h);}p.ph=h;}

 lv=null;setSize();

function burst(x,y,c,n){for(let i=0;i<n&&parts.length<90;i++)parts.push({x,y,vx:(Math.random()-.5)*3,vy:-Math.random()*2.5,l:25+Math.random()*15,c});}
function updParts(){for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.vy+=.12;q.l--;}parts=parts.filter(q=>q.l>0);}

/* ---------- STEP ---------- */
function step(){const jp=K.j&&!PK.j,ap=K.a&&!PK.a,up=K.u&&!PK.u;PK.j=K.j;PK.a=K.a;PK.u=K.u;
 T++;
 if(state==='play'){if(mode==='plat'||mode==='fly')stepPlat(jp,ap,up);else if(mode==='muda')stepMuda(jp||ap);else if(mode==='maze')stepMaze();else if(mode==='wasps')stepWasps(jp,ap);else stepCris();}
 else if(state==='clear'){clearT++;if(clearT%9===0){const x=mode==='plat'||mode==='fly'?p.x+p.w/2:160,y=mode==='plat'||mode==='fly'?p.y:80;burst(x+(Math.random()-.5)*30,y+(Math.random()-.5)*20,['#ffd166','#fff','#ff9ed2'][clearT%3],5);}if(clearT>170)next();}
 updParts();if(shake>0){shake*=.85;if(shake<.3)shake=0;}
 if(state==='play'||state==='clear')hud();}

function stepPlat(jp,ap,up){
 if(st.msgT>0)st.msgT--;
 if(st.egg){if(jp||ap){st.crack++;S.crack();shake=3;burst(p.x+4,p.y,'#fff3cf',5);
   if(st.crack>=5){st.egg=false;for(let i=0;i<3;i++)ents.push({t:'e',w:6,h:5,x:p.x-8+i*9,y:p.y+p.h-5,vx:0,vy:0});toast('¡Eclosión! 🥚 Come tu cascarón: es tu primera comida');S.ok();}}
  updCam();return;}
 if(mode==='fly'&&st.brk<5){if(jp||ap){st.brk++;S.crack();shake=3;burst(p.x+7,p.y-14,'#7fd39a',6);if(st.brk>=5){S.ok();shake=6;burst(p.x+7,p.y-14,'#e8731a',14);burst(p.x+7,p.y-14,'#bff5c8',10);toast('¡Mona rompió la crisálida! 🦋 Ahora infla sus alas');}}updCam();return;}
 if(mode==='fly'&&!st.pumped){if(jp||ap){st.pump++;S.flap();burst(p.x+7,p.y+4,'#ffb35c',5);if(st.pump>=5){st.pumped=true;p.fly=true;S.ok();toast('¡Alas listas! Aletea con SALTAR 🦋');}}updCam();return;}
 const run=K.run||K.runT,dir=(K.r?1:0)-(K.l?1:0);
 if(dir)p.face=dir;
 p.crouch=!!(K.d&&p.onG&&!p.climb&&!p.fly);
 let sp=p.fly?(run?2.4:1.6):(run?2.3:1.4);if(p.crouch)sp=.5;if(p.push)sp=Math.min(sp,.9);
 const onStem=!p.fly&&isStem();
 if(!p.climb&&onStem&&(K.u||(K.d&&!p.onG))){p.climb=true;p.jumps=0;}
 if(p.climb&&!onStem)p.climb=false;
 if(!onStem&&up&&!p.fly)jp=true;
 if(p.fly&&up)jp=true;
 if(p.climb){p.vx=dir*.8;p.vy=((K.d?1:0)-(K.u?1:0))*1.2;
  if(!dir){const sc=Math.floor((p.x+p.w/2)/TS)*TS+8;p.x+=(sc-(p.x+p.w/2))*.3;}
  if(jp){p.climb=false;p.vy=-5;p.jumps=1;S.jump();}}
 else{p.vx+=(dir*sp-p.vx)*(p.onG?.3:.15);
  if(p.fly){p.vy=Math.min(p.vy+.16,K.d?3:1.6);if(jp){p.vy=-2.8;S.flap();burst(p.x+p.w/2,p.y+p.h,'#fff',2);}}
  else{p.vy=Math.min(p.vy+.35,6);if(p.onG)p.coy=6;else if(p.coy>0)p.coy--;
   if(jp){if(p.coy>0){p.vy=-5;p.jumps=1;p.coy=0;S.jump();}else if(p.jumps<2){p.vy=-5;p.jumps=2;S.dj();burst(p.x+p.w/2,p.y+p.h,'#ffffff',6);}}}}
 if(ap&&p.acd<=0){p.atk=12;p.acd=22;S.atk();}
 if(p.atk>0)p.atk--;if(p.acd>0)p.acd--;if(p.inv>0)p.inv--;
 // blocks physics
 for(const b of blocks){b.vy=Math.min(b.vy+.35,6);moveY(b,b.vy,true);if(b.y>lv.H*TS){b.x=b.x0;b.y=b.y0;b.vy=0;}}
 // X
 moveX(p,p.vx);p.push=false;
 for(const b of blocks){if(!ovl(p,b))continue;const fl=(p.x+p.w/2)<(b.x+b.w/2);
  if(p.onG&&Math.abs(p.vx)>.1&&fl===(p.vx>0)){const nx=fl?p.x+p.w:p.x-b.w;moveX(b,nx-b.x);p.x=fl?b.x-p.w:b.x+b.w;p.push=true;}
  else{p.x=fl?b.x-p.w:b.x+b.w;}}

 start(){lives=5;score=0;showIntro(0);},

function openQuiz(i){state='quiz';S.cp();qc=i;const q=Q[i],idx=[0,1,2].sort(()=>Math.random()-.5);

 ov.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>answer(+b.dataset.o));}
function answer(k){const q=Q[qc],ok=k===q.a;if(ok){score+=200;S.ok();}else{score=Math.max(0,score-50);S.bad();}
 show('<h1>'+(ok?'✅ ¡Correcto! +200':'❌ ¡Casi! −50')+'</h1>'+(ok?'':'<p>La respuesta correcta es: <b>'+q.o[q.a]+'</b></p>')+'<p>📚 '+q.e+'</p><button data-a="resume" data-main>Continuar ▶</button>');hud(true);}

 ell(160,132,58,16,-.12,'#58b04a',1);ell(160,132,55,1.2,-.12,'#d8ffc0',.9);for(let j=0;j<7;j++)blob(96+((j*7)%16),70+((j*5)%12),4,'#ff7eb6',.95);R(104,84,2,46,P.stem);

function mkMaze(W,H){const c=Array(W*H).fill(15),v=Array(W*H).fill(0),stk=[0],D=[[0,-1,1,4],[1,0,2,8],[0,1,4,1],[-1,0,8,2]];v[0]=1;
 while(stk.length){const k=stk[stk.length-1],x=k%W,y=k/W|0,n=D.filter(d=>{const a=x+d[0],b=y+d[1];return a>=0&&b>=0&&a<W&&b<H&&!v[b*W+a]});
  if(!n.length){stk.pop();continue}const d=n[Math.random()*n.length|0],nk=(y+d[1])*W+x+d[0];c[k]&=~d[2];c[nk]&=~d[3];v[nk]=1;stk.push(nk);}return c;}

function stepMaze(){const m=mg;m.t++;m.px+=(m.x-m.px)*.35;m.py+=(m.y-m.py)*.35;
 if(!(K.l||K.r||K.u||K.d))m.cd=0;else if(m.cd>0)m.cd--;else{const c=m.c[m.y*m.W+m.x];let mv=1;
  if(K.u){m.d='u';if(!(c&1))m.y--;else mv=0}else if(K.r){m.d='r';m.f=1;if(!(c&2))m.x++;else mv=0}else if(K.d){m.d='d';if(!(c&4))m.y++;else mv=0}else if(K.l){m.d='l';m.f=-1;if(!(c&8))m.x--;else mv=0}
  m.cd=8;if(mv)tone(420+m.x*20,.04,'triangle',.03);}
 if(m.x===m.W-1&&m.y===m.H-1){S.ok();miniDone(Math.max(150,500-Math.floor(m.t/60)*5));}}

 {const X=ox+m.px*cs+10,Y=oy+m.py*cs+10;if(m.d==='u'||m.d==='d'){ctx.save();if(m.d==='d'){ctx.translate(X,Y);ctx.scale(1,-1);ctx.translate(-X,-Y);}dCatV(X-3,Y-7,14,6);ctx.restore();}else dCat(X-7,Y-2,14,6,m.f,m.cd>0);}drawParts(0,0);R(0,0,VW,VH,P.light);}
